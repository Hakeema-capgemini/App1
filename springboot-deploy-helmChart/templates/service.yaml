apiVersion: v1
kind: Service 
metadata: 
  name: {{ .Values.service.name }}
  namespace: rizwanaa726-dev
spec: 
  selector:
    app: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: 8085  #port at which service is internally available
      targetPort: 8082 #port of container
      name: http
  type: ClusterIP  #only accessible inside the cluster
