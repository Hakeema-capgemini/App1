apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-pod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-pod
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 10  # Wait 5 minutes before scaling up again
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 10  # Wait 5 minutes before scaling down again
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
